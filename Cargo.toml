[package]
name = "convertidor"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
# Sin símbolos: el binario pesa menos dentro de la imagen.
strip = true
